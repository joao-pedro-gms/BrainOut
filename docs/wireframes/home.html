<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrainOut — Projetos</title>
  <meta name="description" content="Tela inicial com a lista de projetos do BrainOut." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="phone" aria-label="Tela inicial com a lista de projetos">
    <div class="phone__notch" aria-hidden="true"></div>
    <div class="phone__screen">
      <header class="app-header">
        <div class="user-row">
          <span class="avatar" aria-hidden="true">JP</span>
          <div class="user-row__meta">
            <span class="user-row__name">João Pedro</span>
            <span class="badge badge--owner" aria-label="Perfil Owner">Owner</span>
          </div>
        </div>
        <p style="margin-top: 12px;">Seus projetos</p>
      </header>

      <section class="app-content" style="padding-bottom: 96px;">
        <div class="project-list">
          <a class="project-card" href="project-detail.html">
            <p class="project-card__title">Projeto Integrador</p>
            <p class="project-card__meta">
              <span>5 tarefas abertas</span>
              <span>Vence 30/09</span>
            </p>
          </a>

          <a class="project-card" href="project-detail.html">
            <p class="project-card__title">Estudos ADS</p>
            <p class="project-card__meta">
              <span>3 tarefas abertas</span>
              <span>Sem prazo</span>
            </p>
          </a>

          <a class="project-card" href="project-detail.html">
            <p class="project-card__title">App pessoal</p>
            <p class="project-card__meta">
              <span>2 tarefas abertas</span>
              <span>Vence 12/10</span>
            </p>
          </a>
        </div>

        <a
          class="fab"
          href="project-detail.html"
          aria-label="Criar novo projeto"
          title="Novo projeto"
        >
          <span aria-hidden="true">+</span>
        </a>
      </section>

      <footer class="app-footer">
        <nav class="tab-bar" aria-label="Navegação principal">
          <a class="tab-bar__item tab-bar__item--active" href="home.html">
            <span class="tab-bar__icon" aria-hidden="true"></span>
            Projetos
          </a>
          <a class="tab-bar__item" href="#">
            <span class="tab-bar__icon" aria-hidden="true"></span>
            Tarefas
          </a>
          <a class="tab-bar__item" href="#">
            <span class="tab-bar__icon" aria-hidden="true"></span>
            Equipe
          </a>
          <a class="tab-bar__item" href="settings.html">
            <span class="tab-bar__icon" aria-hidden="true"></span>
            Ajustes
          </a>
        </nav>
      </footer>
    </div>
  </main>
</body>
</html>
