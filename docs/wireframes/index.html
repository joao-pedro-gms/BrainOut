  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      align-items: flex-start;
      padding: 32px 16px;
    }
    .index {
      width: 360px;
      background: #ffffff;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.12);
    }
    .index h1 {
      margin: 0 0 4px;
      font-size: 20px;
    }
    .index p {
      margin: 0 0 20px;
      color: #52606d;
      font-size: 14px;
    }
    .index ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .index a {
      display: block;
      padding: 12px 14px;
      border: 1px solid #e4e7eb;
      border-radius: 10px;
      text-decoration: none;
      color: inherit;
    }
    .index a:hover {
      border-color: #c5cdd6;
