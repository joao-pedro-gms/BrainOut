<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrainOut — Criar conta</title>
  <meta name="description" content="Tela de cadastro do BrainOut." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="phone" aria-label="Tela de cadastro do BrainOut">
    <div class="phone__notch" aria-hidden="true"></div>
    <div class="phone__screen">
      <header class="app-header">
        <h1>Criar conta</h1>
        <p>Preencha os dados para começar.</p>
      </header>

      <section class="app-content">
        <div class="form" role="group" aria-label="Prévia de formulário">
          <div class="field">
            <label for="name">Nome</label>
            <input
              id="name"
              name="name"
              type="text"
              autocomplete="name"
              placeholder="Seu nome completo"
              readonly
            />
          </div>

          <div class="field">
            <label for="email">E-mail</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="seu@email.com"
              readonly
            />
          </div>

          <div class="field">
            <label for="password">Senha</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="Crie uma senha"
              readonly
            />
          </div>

          <div class="field">
            <label for="password-confirm">Confirmar senha</label>
            <input
              id="password-confirm"
              name="password-confirm"
              type="password"
              autocomplete="new-password"
              placeholder="Digite a senha novamente"
              readonly
            />
          </div>

          <fieldset class="field">
            <legend>Perfil</legend>
            <div class="btn-row">
              <label class="role-option">
                <input type="radio" name="role" value="owner" checked />
                <span>Owner — Cria e gerencia projetos da equipe.</span>
              </label>
              <label class="role-option">
                <input type="radio" name="role" value="member" />
                <span>Member — Acompanha tarefas dos projetos.</span>
              </label>
            </div>
          </fieldset>

          <span class="btn btn--primary btn--sample">Cadastrar</span>
        </div>

        <p class="preview-note">Prévia visual: sem autenticação.</p>

        <a class="link" href="login.html">Voltar ao login</a>
      </section>

      <footer class="app-footer">
        <div class="app-footer--placeholder">BrainOut · v0.1</div>
      </footer>
    </div>
  </main>
</body>
</html>
