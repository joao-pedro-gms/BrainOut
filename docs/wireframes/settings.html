<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrainOut — Configurações</title>
  <meta name="description" content="Tela de configurações do BrainOut." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="phone" aria-label="Tela de configurações do BrainOut">
    <div class="phone__notch" aria-hidden="true"></div>
    <div class="phone__screen">
      <header class="app-header">
        <h1>Configurações</h1>
        <p>Preferências da sua conta e do aplicativo.</p>
      </header>

      <section class="app-content">
        <div class="settings-section">
          <h2 class="section-title">Conta</h2>
          <ul class="settings-list">
            <li><span class="settings-row"><span class="settings-row__label">Perfil</span><span class="settings-row__chevron" aria-hidden="true">›</span></span></li>
            <li><span class="settings-row"><span class="settings-row__label">Notificações</span><span class="settings-row__chevron" aria-hidden="true">›</span></span></li>
          </ul>
        </div>

        <div class="settings-section">
          <h2 class="section-title">Aparência</h2>
          <ul class="settings-list">
            <li><span class="settings-row"><span class="settings-row__label">Tema</span><span class="settings-row__chevron" aria-hidden="true">›</span></span></li>
          </ul>
        </div>

        <div class="settings-section">
          <h2 class="section-title">Sessão</h2>
          <ul class="settings-list">
            <li>
              <a class="settings-row settings-row--link settings-row--danger" href="login.html">
                <span class="settings-row__label">Sair</span>
                <span class="settings-row__chevron" aria-hidden="true">›</span>
              </a>
            </li>
          </ul>
        </div>
      </section>

      <footer class="app-footer">
        <nav class="tab-bar" aria-label="Navegação principal">
          <a class="tab-bar__item" href="home.html">
            <span class="tab-bar__icon"><svg aria-hidden="true"><use href="icons.svg#folder"></use></svg></span>
            Projetos
          </a>
          <a class="tab-bar__item" href="tasks.html">
            <span class="tab-bar__icon"><svg aria-hidden="true"><use href="icons.svg#tasks"></use></svg></span>
            Tarefas
          </a>
          <a class="tab-bar__item" href="dashboard.html">
            <span class="tab-bar__icon"><svg aria-hidden="true"><use href="icons.svg#chart"></use></svg></span>
            Painel
          </a>
          <a class="tab-bar__item tab-bar__item--active" href="settings.html" aria-current="page">
            <span class="tab-bar__icon"><svg aria-hidden="true"><use href="icons.svg#settings"></use></svg></span>
            Configurações
          </a>
        </nav>
      </footer>
    </div>
  </main>
</body>
</html>
