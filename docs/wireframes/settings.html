<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrainOut — Configurações</title>
  <meta name="description" content="Tela de configurações do BrainOut." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="phone" aria-label="Tela de configurações do BrainOut">
    <div class="phone__notch" aria-hidden="true"></div>
    <div class="phone__screen">
      <header class="app-header">
        <h1>Configurações</h1>
        <p>Preferências da sua conta e do aplicativo.</p>
      </header>

      <section class="app-content" style="padding-bottom: 24px;">
        <div class="settings-section">
          <h2 class="section-title">Conta</h2>
          <ul class="settings-list">
            <li><a href="#"><span>Perfil</span></a></li>
            <li><a href="#"><span>Notificações</span></a></li>
            <li><a href="#"><span>Sincronização</span></a></li>
          </ul>
        </div>

        <div class="settings-section">
          <h2 class="section-title">Aparência</h2>
          <ul class="settings-list">
            <li><a href="#"><span>Tema</span></a></li>
            <li><a href="#"><span>Idioma</span></a></li>
          </ul>
        </div>

        <div class="settings-section">
          <h2 class="section-title">Sessão</h2>
          <ul class="settings-list">
            <li>
              <button type="button" class="danger">
                <span>Sair</span>
              </button>
            </li>
          </ul>
        </div>
      </section>

      <footer class="app-footer">
        <nav class="tab-bar" aria-label="Navegação principal">
          <a class="tab-bar__item" href="home.html">
            <span class="tab-bar__icon" aria-hidden="true"></span>
            Projetos
          </a>
          <a class="tab-bar__item" href="#">
            <span class="tab-bar__icon" aria-hidden="true"></span>
            Tarefas
          </a>
          <a class="tab-bar__item" href="#">
            <span class="tab-bar__icon" aria-hidden="true"></span>
            Insights
          </a>
          <a class="tab-bar__item tab-bar__item--active" href="settings.html">
            <span class="tab-bar__icon" aria-hidden="true"></span>
            Ajustes
          </a>
        </nav>
      </footer>
    </div>
  </main>
</body>
</html>
