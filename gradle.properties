# Gradle JVM settings — alinhado com o que o CI provisiona (Temurin JDK 17).
# Localmente o Gradle aceita JDK 21 apontado via JAVA_HOME; o bytecode alvo
# continua sendo Java 17 (sourceCompatibility = VERSION_17 nos módulos).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Auto-detecta JDKs instalados em locais comuns do sistema. Necessário para que
# `sourceCompatibility = VERSION_17` funcione sem baixar toolchain quando o
# desenvolvedor tem apenas JDK 21 (e seta JAVA_HOME antes de ./gradlew).
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
# `android.nonFinalResIds=false` foi removido: deprecated no AGP 9 (o default
# atual é `true` e será permanente no AGP 10). Não precisamos do opt-out.

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# KSP
ksp.incremental=true

