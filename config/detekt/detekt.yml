# João Pedro G M Silva - PUC Goiás ADS - 20251012000740
# Configuração base do detekt — sobrepõe regras padrão sem endurecer demais.
# Adicione regras ao longo do projeto conforme a equipe amadurece.

build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    complexity: 2
    LongParameterList: 1
    style: 1
    comments: 1

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false

processors:
  active: true

console-reports:
  active: true

output-reports:
  active: true

comments:
  active: true
  CommentOverPrivateProperty:
    active: false
  CommentOverPrivateFunction:
    active: false
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false

complexity:
  active: true
  ComplexCondition:
    threshold: 6
  CyclomaticComplexMethod:
    threshold: 20
  LongMethod:
    threshold: 80
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 8
    ignoreDefaultParameters: true
    ignoreDataClasses: true
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 15
    thresholdInInterfaces: 15
    thresholdInObjects: 15
    thresholdInEnums: 15

empty-blocks:
  active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - 'IllegalStateException'
      - 'IllegalArgumentException'
      - 'RuntimeException'
  # SwallowedException relaxado: no E3.6 o CompleteTaskWorker engole
  # a exceção de escrita de propósito — o WorkManager registra o retry
  # com backoff e reprocessa o trabalho (ver CompleteTaskWorker).
  SwallowedException:
    active: false

naming:
  active: true
  ClassNaming:
    classPattern: '[A-Z][a-zA-Z0-9]*'
  FunctionNaming:
    functionPattern: '[a-z][a-zA-Z0-9]*'
    # Funções anotadas com @Composable seguem convenção PascalCase (Compose).
    # @Preview e @HiltAndroidApp também geram wrappers que detekt não precisa
    # auditar (são consumidas em runtime por reflexão).
    ignoreAnnotated:
      - 'Composable'
      - 'Preview'
      - 'HiltAndroidApp'
      - 'AndroidEntryPoint'
  PackageNaming:
    packagePattern: '[a-z]+(\.[a-z][a-zA-Z0-9]*)*'
  # `MatchingDeclarationName` exige que o nome do arquivo case com a
  # ÚLTIMA declaração de topo. Três arquivos violam a regra, e nos três
  # o nome é deliberado e melhor que o nome da declaração:
  # - `BrainOutNeoTheme.kt` — agrupa o tema Neo (`NeoThemeSpec`,
  #   `NeoLightTheme`, `NeoDarkTheme`, `resolveNeoThemeSpec`,
  #   `BrainOutNeoTheme`) e é nomeado pelo wrapper público que o app
  #   chama. Renomear para `NeoThemeSpec.kt` inverteria a hierarquia:
  #   a spec viraria o título e o tema, o detalhe.
  # - `AssetFixtures.kt` / `NeoTokenFixtures.kt` — o sufixo `Fixtures`
  #   é a convenção dos auxiliares de teste do projeto; o conteúdo são
  #   fábricas de dados de teste (`FontAsset`, `ContrastPair`), não
  #   tipos de domínio.
  # Ou seja: os três nomes são melhores que o que a regra exigiria, e
  # `ignoreAnnotated` não se aplica (ninguém deles tem anotação). A
  # regra é útil em código que não tem convenção própria de
  # "arquivo = agrupador temático"; aqui ela só atrapalharia.
  MatchingDeclarationName:
    active: false

performance:
  active: true

potential-bugs:
  active: true

style:
  active: true
  # E3.6 — o DeadlineWorker (publicação do lembrete) tem cortes-circuito
  # legítimos; o limite padrão de 2 returns era insuficiente.
  ReturnCount:
    active: true
    max: 4
    excludedFunctions: ['equals']
  MagicNumber:
    active: true
    # '0'..'4' cobre a faixa completa do TaskPriority (E1.4). Os demais
    # são limites comuns em regras de validação.
    ignoreNumbers: ['-1', '0', '1', '2', '3', '4', '100', '500', '1000', '120', '200']
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: false
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreEnums: false
  UnusedPrivateMember:
    active: true
    # Previews do Compose são consumidos pelo Android Studio / Preview tooling,
    # não pelo código de produção — não devem ser relatados como unused.
    ignoreAnnotated:
      - 'Preview'
  UnusedImports:
    active: true
