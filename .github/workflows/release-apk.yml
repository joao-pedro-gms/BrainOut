# Release assinado (E3.7) — gera .aab de bundleRelease assinado com keystore
# fornecido via secrets do repositório. Disparado automaticamente em tags 'v*'.
#
# Segredos esperados (Settings -> Secrets and variables -> Actions):
#   BRAINOUT_KEYSTORE_BASE64    - keystore .jks codificado em base64 (uma linha)
#   BRAINOUT_KEYSTORE_PASSWORD  - senha do keystore
#   BRAINOUT_KEY_ALIAS          - alias da chave dentro do keystore
#   BRAINOUT_KEY_PASSWORD       - senha da chave
#
# Procedimento de geração do keystore e corte de release: docs/CI-CD.md.
# O keystore físico NUNCA vai ao repositório.

name: Release AAB assinado

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: bundleRelease assinado
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validate signing secrets (P0-6)
        # Se qualquer dos 4 secrets estiver ausente o build de release
        # cai no caminho "unsigned fallback" do `:app/build.gradle.kts`
        # e produz um .aab não-assinado silenciosamente verde.
        # Validar explicitamente para falhar o job antes do upload.
        env:
          BASE64: ${{ secrets.BRAINOUT_KEYSTORE_BASE64 }}
          STORE_PWD: ${{ secrets.BRAINOUT_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.BRAINOUT_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.BRAINOUT_KEY_PASSWORD }}
        run: |
          set -e
          missing=0
          for var in BASE64 STORE_PWD ALIAS KEY_PWD; do
            if [ -z "${!var}" ]; then
              echo "::error::Secret $var ausente — cadastre os 4 secrets antes de cortar uma tag (ver docs/CI-CD.md)."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Decode keystore
        env:
          BRAINOUT_KEYSTORE_BASE64: ${{ secrets.BRAINOUT_KEYSTORE_BASE64 }}
        run: |
          set -e
          echo "$BRAINOUT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/brainout-release.jks"

      - name: Preflight do keystore (DEF-02)
        # Em PKCS12 a senha da chave e a senha do keystore sao a mesma
        # coisa. Um `keytool -genkeypair` com senhas divergentes produz
        # um keystore que o Gradle nao abre — e o sintoma e a mensagem
        # criptica "Get Key failed: Given final block not properly
        # padded", que nao diz nada sobre a causa (DEF-02).
        # Abrir o keystore aqui transforma isso em um diagnostico
        # util, antes do build.
        env:
          STORE_PWD: ${{ secrets.BRAINOUT_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.BRAINOUT_KEY_ALIAS }}
        run: |
          set -e
          KEYSTORE="$RUNNER_TEMP/brainout-release.jks"
          if ! keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PWD" >/dev/null 2>&1; then
            echo "::error::O keystore nao abre com BRAINOUT_KEYSTORE_PASSWORD. Em PKCS12 a senha da chave e a senha do keystore sao a mesma: gere com 'keytool -genkeypair -storetype PKCS12' usando a MESMA senha em -storepass e -keypass, e cadastre os 4 secrets com esse valor (ver docs/CI-CD.md)."
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PWD" -alias "$ALIAS" >/dev/null 2>&1; then
            echo "::error::O alias '$ALIAS' nao existe no keystore."
            exit 1
          fi
          echo "Preflight do keystore OK."

      - name: bundleRelease assinado
        env:
          BRAINOUT_KEYSTORE_PATH: ${{ runner.temp }}/brainout-release.jks
          BRAINOUT_KEYSTORE_PASSWORD: ${{ secrets.BRAINOUT_KEYSTORE_PASSWORD }}
          BRAINOUT_KEY_ALIAS: ${{ secrets.BRAINOUT_KEY_ALIAS }}
          BRAINOUT_KEY_PASSWORD: ${{ secrets.BRAINOUT_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon --console=plain

      - name: Verify .aab signature (P0-6)
        # Validação adicional: confirma que o .aab publicado é o assinado.
        # Se o fallback não-assinado tiver sido acionado, o job falha aqui
        # antes do upload.
        # O caminho do .aab muda com flavors (`bundle/<flavor>Release/`);
        # usamos find para localizar o .aab gerado em qualquer subdir.
        run: |
          set -e
          AAB=$(find app/build/outputs/bundle -maxdepth 3 -name '*.aab' -type f | head -n1)
          if [ -z "$AAB" ]; then
            echo "::error::Nenhum .aab gerado em app/build/outputs/bundle/."
            exit 1
          fi
          echo "Verificando assinatura de: $AAB"
          if ! jarsigner -verify "$AAB" >/dev/null 2>&1; then
            echo "::error::$AAB não passou em jarsigner -verify — provavelmente não-assinado."
            jarsigner -verify -verbose "$AAB" || true
            exit 1
          fi
          echo "jarsigner OK: $AAB"

      - name: Upload do .aab assinado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: brainout-release-aab-${{ github.ref_name }}
          path: app/build/outputs/bundle/
          if-no-files-found: error
          retention-days: 30