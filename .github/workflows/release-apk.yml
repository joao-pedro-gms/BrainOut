# Release assinado (E3.7) — gera .aab de bundleRelease assinado com keystore
# fornecido via secrets do repositório. Disparado automaticamente em tags 'v*'.
#
# Segredos esperados (Settings -> Secrets and variables -> Actions):
#   BRAINOUT_KEYSTORE_BASE64    - keystore .jks codificado em base64 (uma linha)
#   BRAINOUT_KEYSTORE_PASSWORD  - senha do keystore
#   BRAINOUT_KEY_ALIAS          - alias da chave dentro do keystore
#   BRAINOUT_KEY_PASSWORD       - senha da chave
#
# Procedimento de geração do keystore e corte de release: docs/CI-CD.md.
# O keystore físico NUNCA vai ao repositório.

name: Release AAB assinado

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: bundleRelease assinado
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode keystore
        env:
          BRAINOUT_KEYSTORE_BASE64: ${{ secrets.BRAINOUT_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$BRAINOUT_KEYSTORE_BASE64" ]; then
            echo "::error::Secret BRAINOUT_KEYSTORE_BASE64 ausente - cadastre os 4 secrets antes de cortar uma tag de release (ver docs/CI-CD.md)."
            exit 1
          fi
          echo "$BRAINOUT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/brainout-release.jks"

      - name: bundleRelease assinado
        env:
          BRAINOUT_KEYSTORE_PATH: ${{ runner.temp }}/brainout-release.jks
          BRAINOUT_KEYSTORE_PASSWORD: ${{ secrets.BRAINOUT_KEYSTORE_PASSWORD }}
          BRAINOUT_KEY_ALIAS: ${{ secrets.BRAINOUT_KEY_ALIAS }}
          BRAINOUT_KEY_PASSWORD: ${{ secrets.BRAINOUT_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon --console=plain

      - name: Upload do .aab assinado
        uses: actions/upload-artifact@v4
        with:
          name: brainout-release-aab-${{ github.ref_name }}
          path: app/build/outputs/bundle/release/
          if-no-files-found: error
          retention-days: 30