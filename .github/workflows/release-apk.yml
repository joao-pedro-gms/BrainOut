name: Release APK/AAB

# Gera o pacote instalável (R14) em modo release, assinado com keystore
# fornecido via secrets do repositório. Acionado manualmente via
# workflow_dispatch OU automaticamente em tags 'v*'.
#
# Segredos esperados (Settings -> Secrets and variables -> Actions):
#   RELEASE_KEYSTORE_BASE64  - keystore (.jks/.keystore) codificado em base64
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD
#
# O artifact (app-release.aab e app-release.apk) fica disponível na página
# do run. Nenhum upload automático para loja externa.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de pacote'
        required: true
        type: choice
        options:
          - aab
          - apk
        default: aab
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ github.event.inputs.build_type || 'aab' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -e
          mkdir -p secrets
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > secrets/release.keystore
          ls -la secrets/

      - name: Write keystore.properties
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=secrets/release.keystore
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Assemble AAB
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == '' }}
        run: ./gradlew bundleRelease --no-daemon --console=plain

      - name: Assemble APK
        if: ${{ github.event.inputs.build_type == 'apk' }}
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Collect artifacts
        id: collect
        run: |
          mkdir -p release-artifacts
          find app/build/outputs -type f \( -name '*.aab' -o -name '*.apk' \) -exec cp {} release-artifacts/ \;
          ls -la release-artifacts/

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brainout-release-${{ github.event.inputs.build_type || 'aab' }}-${{ github.sha }}
          path: release-artifacts/
          retention-days: 30

      - name: Attach to GitHub Release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*
          generate_release_notes: true