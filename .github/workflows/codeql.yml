name: CodeQL

# Análise estática de segurança. CodeQL roda em Java + Kotlin quando há
# código fonte real; falha limpa (configuration_error) em PRs sem código,
# o que é tratado como não-bloqueante para o merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Roda semanalmente na madrugada de domingo (cron de 5 campos).
    - cron: '17 6 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        language: ['java', 'kotlin']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # `build-mode: none` em linguagens compiladas (Java/Kotlin)
          # só examina classes pré-compiladas — para AGP 9 + Kotlin não
          # há nada pré-compilado no checkout, então a análise fica
          # vazia. `autobuild` delega ao CodeQL descobrir a toolchain.
          build-mode: autobuild

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: ${{ matrix.language }}.sarif

      - name: Upload SARIF
        if: always() && hashFiles(format('{0}.sarif', matrix.language)) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ matrix.language }}.sarif