name: CI

# Pipeline principal de qualidade. Disparado em todo push de branch e em PRs contra main.
# Cobre: análise estática (ktlint + detekt), testes unitários e testes de integração
# com o serviço de retaguarda sob service container.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

jobs:
  static-analysis:
    name: Static analysis (ktlint + detekt)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validate Gradle wrapper
        run: |
          if [ -x ./gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper OK"
          elif [ ! -f ./gradlew ]; then
            echo "::warning::gradlew ausente — ainda não há projeto Gradle neste PR."
          else
            echo "::warning::gradlew presente mas wrapper jar ausente."
          fi

      - name: Run ktlint
        if: hashFiles('**/build.gradle*') != ''
        run: ./gradlew ktlintCheck --no-daemon --console=plain

      - name: Run detekt
        if: hashFiles('**/build.gradle*') != ''
        run: ./gradlew detekt --no-daemon --console=plain

      - name: Upload detekt report
        if: always() && hashFiles('**/build.gradle*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: |
            **/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 14

  unit-tests:
    name: Unit tests (JUnit + Compose)
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests
        if: hashFiles('**/build.gradle*') != ''
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Generate JaCoCo coverage report
        if: hashFiles('**/build.gradle*') != ''
        run: ./gradlew :core:domain:jacocoTestReport --no-daemon --console=plain

      - name: Run Android lint
        if: hashFiles('**/build.gradle*') != ''
        run: ./gradlew lintDebug --no-daemon --console=plain
        continue-on-error: true

      - name: Publish unit test results
        if: hashFiles('**/build.gradle*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
            **/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  backend-integration:
    name: Backend integration tests
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build backend stub image
        run: docker build -t backend-stub:local ./backend-stub

      - name: Run backend stub container
        run: |
          docker run -d --name brainout-api \
            -p 8000:8000 \
            -e APP_ENV=test \
            backend-stub:local
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "Backend up"; break
            fi
            echo "Waiting for backend... ($i)"; sleep 2
          done
          curl -fsS http://localhost:8000/health
          echo

      - name: Smoke-test endpoints
        run: |
          curl -fsS http://localhost:8000/v1/ping || true
          echo

      - name: Backend integration suite (Android side)
        if: hashFiles('**/build.gradle*') != ''
        env:
          BASE_URL: http://localhost:8000
        run: ./gradlew connectedDebugAndroidTest --no-daemon --console=plain
        continue-on-error: true

      - name: Upload integration test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-logs
          path: |
            **/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop and remove container
        if: always()
        run: docker rm -f brainout-api || true