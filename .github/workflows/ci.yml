name: CI

# Pipeline principal de qualidade. Disparado em todo push de branch e em PRs contra main.
# Cobre: análise estática (ktlint + detekt), testes unitários e testes de integração
# com o serviço de retaguarda sob service container.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

jobs:
  static-analysis:
    name: Static analysis (ktlint + detekt)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validate Gradle wrapper
        run: |
          if [ -x ./gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper OK"
          elif [ ! -f ./gradlew ]; then
            echo "::warning::gradlew ausente — ainda não há projeto Gradle neste PR."
          else
            echo "::warning::gradlew presente mas wrapper jar ausente."
          fi

      - name: Run ktlint
        if: hashFiles('**/build.gradle*') != ''
        run: ./gradlew ktlintCheck --no-daemon --console=plain

      - name: Run detekt
        if: hashFiles('**/build.gradle*') != ''
        run: ./gradlew detekt --no-daemon --console=plain

      - name: Upload detekt report
        if: always() && hashFiles('**/build.gradle*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: |
            **/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 14

  unit-tests:
    name: Unit tests (JUnit + Compose)
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests
        if: hashFiles('**/build.gradle*') != ''
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      # E4.7: cobertura mínima de 60% em :core:domain e :core:data.
      # koverVerify falha o job se o bound não for atendido.
      - name: Verify coverage (Kover >= 60%)
        if: hashFiles('**/build.gradle*') != ''
        run: ./gradlew :core:domain:koverVerify :core:data:koverVerify --no-daemon --console=plain

      # E4.7: relatório HTML de cobertura publicado como artifact do CI.
      - name: Generate Kover coverage report
        if: hashFiles('**/build.gradle*') != ''
        run: ./gradlew :core:domain:koverHtmlReport :core:data:koverHtmlReport --no-daemon --console=plain

      - name: Run Android lint
        if: hashFiles('**/build.gradle*') != ''
        run: ./gradlew lintDebug --no-daemon --console=plain
        continue-on-error: true

      - name: Publish unit test results
        if: hashFiles('**/build.gradle*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
            **/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage artifact
        if: hashFiles('**/build.gradle*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            core/domain/build/reports/kover/html/
            core/data/build/reports/kover/html/
          if-no-files-found: error
          retention-days: 14

  backend-integration:
    name: Backend integration tests
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build backend stub image
        run: docker build -t backend-stub:local ./backend-stub

      - name: Run backend stub container
        run: |
          docker run -d --name brainout-api \
            -p 8000:8000 \
            -e APP_ENV=test \
            backend-stub:local
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "Backend up"; break
            fi
            echo "Waiting for backend... ($i)"; sleep 2
          done
          curl -fsS http://localhost:8000/health
          echo

      # Contrato do stub (E3.3 — backend-stub-contract): exercita PUT/DELETE
      # e o roundtrip de tags para garantir que o SyncWorker tem o que
      # precisa. UUIDs são gerados no cliente e enviados no body/path.
      - name: Smoke-test endpoints (PUT/DELETE/tags)
        run: |
          set -e
          BASE=http://localhost:8000
          PID="11111111-1111-4111-8111-111111111111"
          TID="22222222-2222-4222-8222-222222222222"
          curl -fsS $BASE/v1/ping; echo
          # POST com id do cliente
          curl -fsS -X POST $BASE/v1/projects \
            -d "{\"id\":\"$PID\",\"name\":\"smoke\"}" \
            -H 'Content-Type: application/json'; echo
          # PUT (upsert)
          curl -fsS -X PUT $BASE/v1/projects/$PID \
            -d "{\"id\":\"$PID\",\"name\":\"smoke-v2\"}" \
            -H 'Content-Type: application/json'; echo
          # Tag + associação
          TAG_JSON=$(curl -fsS -X POST $BASE/v1/tags \
            -d '{"name":"smoke","color":"#00ff00"}' \
            -H 'Content-Type: application/json')
          echo "$TAG_JSON"
          TAG_ID=$(echo "$TAG_JSON" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          curl -fsS -X POST $BASE/v1/projects/$PID/tags \
            -d "{\"tag_id\":\"$TAG_ID\"}" \
            -H 'Content-Type: application/json'; echo
          # DELETE presente + ausente (idempotente)
          curl -sS -X DELETE $BASE/v1/projects/$PID -o /dev/null -w "del-present=%{http_code}\n"
          curl -sS -X DELETE $BASE/v1/projects/$PID -o /dev/null -w "del-absent=%{http_code}\n"

      # Suíte pytest do stub (cobre upsert idempotente, delete 204→204,
      # tags roundtrip, cascade, validação de UUID, divergência id body/path).
      - name: Run backend stub contract tests (pytest)
        working-directory: backend-stub
        run: |
          python -m pip install --quiet --no-cache-dir -r requirements.txt
          python -m pytest tests/ -v

      - name: Backend integration suite (Android side)
        if: hashFiles('**/build.gradle*') != ''
        env:
          BASE_URL: http://localhost:8000
        run: ./gradlew connectedDebugAndroidTest --no-daemon --console=plain
        continue-on-error: true

      - name: Upload integration test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-integration-logs
          path: |
            **/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop and remove container
        if: always()
        run: docker rm -f brainout-api || true