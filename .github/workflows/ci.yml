name: CI

# Pipeline principal de qualidade. Disparado em todo push de branch e em PRs contra main.
# Cobre: análise estática (ktlint + detekt), testes unitários e testes de integração
# de persistência local e compilação dos testes instrumentados.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

jobs:
  static-analysis:
    name: Static analysis (ktlint + detekt)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test release workflow validation
        run: python3 -m unittest discover -s .github/tests -v

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validate Gradle wrapper
        run: |
          if [ -x ./gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper OK"
          elif [ ! -f ./gradlew ]; then
            echo "::warning::gradlew ausente — ainda não há projeto Gradle neste PR."
          else
            echo "::warning::gradlew presente mas wrapper jar ausente."
          fi

      - name: Run ktlint
        if: hashFiles('**/build.gradle*') != ''
        run: ./gradlew ktlintCheck --no-daemon --console=plain

      - name: Run detekt
        if: hashFiles('**/build.gradle*') != ''
        run: ./gradlew detekt --no-daemon --console=plain

      - name: Upload detekt report
        if: always() && hashFiles('**/build.gradle*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: |
            **/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 14

  unit-tests:
    name: Unit tests (JUnit + Compose)
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests
        if: hashFiles('**/build.gradle*') != ''
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Run feature unit tests (explicit)
        if: hashFiles('**/build.gradle*') != ''
        run: >-
          ./gradlew
          :feature:projects:testDebugUnitTest
          :feature:tasks:testDebugUnitTest
          :feature:auth:testDebugUnitTest
          :feature:settings:testDebugUnitTest
          --no-daemon --console=plain

      - name: Run core:ui unit tests (explicit)
        if: hashFiles('**/build.gradle*') != ''
        run: ./gradlew :core:ui:testDebugUnitTest --no-daemon --console=plain

      # E4.7: cobertura mínima de 60% em :core:domain e :core:data.
      # koverVerify falha o job se o bound não for atendido.
      - name: Verify coverage (Kover >= 60%)
        if: hashFiles('**/build.gradle*') != ''
        run: ./gradlew :core:domain:koverVerify :core:data:koverVerify --no-daemon --console=plain

      # E4.7: relatório HTML de cobertura publicado como artifact do CI.
      - name: Generate Kover coverage report
        if: hashFiles('**/build.gradle*') != ''
        run: ./gradlew :core:domain:koverHtmlReport :core:data:koverHtmlReport --no-daemon --console=plain

      # Todos os módulos Android usam a variante debug, sem flavors remotos.
      - name: Run Android lint
        if: hashFiles('**/build.gradle*') != ''
        run: ./gradlew lintDebug --no-daemon --console=plain

      - name: Publish unit test results
        if: hashFiles('**/build.gradle*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
            **/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage artifact
        if: hashFiles('**/build.gradle*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            core/domain/build/reports/kover/html/
            core/data/build/reports/kover/html/
          if-no-files-found: error
          retention-days: 14

  local-integration:
    name: Local build and instrumentation compilation
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app and instrumented tests
        run: ./gradlew :app:assembleDebug :core:data:assembleDebugAndroidTest :feature:auth:assembleDebugAndroidTest --no-daemon --console=plain
      - name: Verify final local manifest
        run: python3 .github/scripts/verify_local_manifest.py app/build/intermediates/packaged_manifests/debug/processDebugManifestForPackage/AndroidManifest.xml
      - name: Verify migration test APK contents
        run: python3 .github/scripts/verify_data_test_apk.py core/data/build/outputs/apk/androidTest/debug/data-debug-androidTest.apk
